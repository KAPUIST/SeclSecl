<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Room List</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
      }
      .chat-room {
        border: 1px solid #ddd;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 8px;
        background-color: #fff;
      }
      .chat-room .last-message {
        font-size: 12px;
        color: #666;
      }
      .chat-room .is-read {
        font-size: 12px;
        color: #999;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>Chat Rooms</h1>
    <div id="chatRoomList"></div>

    <script>
      const token =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1aWQiOiJkOTBmYTA3Yi03ZTNmLTQwYmYtOWQ5Yi1lMDllOTM1N2RlZTciLCJlbWFpbCI6ImtpbWNoaUBnbWFpbC5jb20iLCJ0eXBlIjoiY3AiLCJpYXQiOjE3MjM3MDQxMDQsImV4cCI6MTcyMzcxMTMwNH0.EneinY_IxxLqu-Nb-LLchhSUOnxiqCANwRP-WMNpBkY' // 실제 JWT 토큰을 넣으세요
      const decodedToken = jwt_decode(token)
      console.log('decodedToken!!', decodedToken)
      const userUid = decodedToken.uid
      console.log('유저아이디!!', userUid)

      // 소켓 연결 설정
      const socket = io('ws://localhost:3000/chatting', {
        path: '/socket.io',
        query: { token },
        transports: ['websocket'],
      })

      socket.on('connect', () => {
        console.log('User WebSocket connection opened')
        loadChatRooms() // 연결 시 채팅방 목록을 로드
      })

      async function loadChatRooms() {
        try {
          const response = await fetch('http://localhost:3000/api/chat/rooms', {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
          })

          const chatRooms = await response.json()

          // 최신 메시지 기준으로 채팅방 목록을 내림차순으로 정렬
          chatRooms.sort((a, b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime))
          displayChatRooms(chatRooms)
        } catch (error) {
          console.error('Error fetching chat rooms:', error)
        }
      }

      function displayChatRooms(chatRooms) {
        const chatRoomList = document.getElementById('chatRoomList')
        chatRoomList.innerHTML = '' // 기존 목록 초기화

        chatRooms.forEach((room) => {
          const chatRoomElement = document.createElement('div')
          chatRoomElement.className = 'chat-room'
          chatRoomElement.innerHTML = `
            <div class="last-message">${room.lastMessage}</div>
            <div class="is-read">${room.isRead ? '읽음' : '안읽음'}</div>
            <div class="last-message-time">${new Date(room.lastMessageTime).toLocaleString()}</div>
          `
          chatRoomElement.addEventListener('click', () => openChatRoom(room.chatRoomUid))
          chatRoomList.appendChild(chatRoomElement)
        })
      }

      function openChatRoom(chatRoomUid) {
        console.log('Opening chat room:', chatRoomUid)
        socket.emit('markAsRead', { chatRoomUid })
        // 해당 채팅방을 열고 메시지를 로드하는 로직을 구현합니다.
      }

      socket.on('messagesMarkedAsRead', ({ chatRoomUid, readerUid }) => {
        console.log(`Messages in room ${chatRoomUid} marked as read by ${readerUid} `)

        //채팅방 읽은 상태 업데이트
        const chatRoomElement = document.querySelector(`[data-room-id="${chatRoomUid}"]`)
        if (chatRoomElement) {
          chatRoomElement.querySelector('.is-read').textContent = '읽음'
        }
      })

      // 실시간 메시지 수신 시 해당 채팅방을 목록 맨 위로 이동
      socket.on('receiveMessage', (message) => {
        console.log('Received new message:', message)
        const chatRoomList = document.getElementById('chatRoomList')
        const roomElements = chatRoomList.querySelectorAll('.chat-room')

        roomElements.forEach((roomElement) => {
          if (roomElement.dataset.roomId === message.chatRoomUid) {
            chatRoomList.removeChild(roomElement)
            chatRoomList.insertBefore(roomElement, chatRoomList.firstChild)
            roomElement.querySelector('.last-message').textContent = message.content
            roomElement.querySelector('.last-message-time').textContent = new Date(message.createdAt).toLocaleString()
            roomElement.querySelector('.is-read').textContent = '안읽음' // 실시간으로 받은 메시지는 읽지 않은 상태
          }
        })
      })

      socket.on('error', (error) => {
        console.error('WebSocket error:', error)
      })

      socket.on('disconnect', (event) => {
        console.log('WebSocket connection closed', event)
      })

      window.onload = () => {
        socket.connect()
      }
    </script>
  </body>
</html>
