<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification Test</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  </head>
  <body>
    <h1>Notification Test</h1>
    <ul id="notifications"></ul>

    <script>
      const token =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1aWQiOiJlNDcyZGM0Ny03NjRlLTQ5MmItOGIxZi03MzI4NzM2MGFjMzkiLCJlbWFpbCI6Inlld29uQGdtYWlsLmNvbSIsInR5cGUiOiJtYWluIiwiaWF0IjoxNzIzNTU5MTMwLCJleHAiOjE3MjM1NjYzMzB9.LFEhZ2gmroj_Y5PtUzWSqyflUdWLFcvVFWVHq8gLxMg'
      const socket = io('http://localhost:3000') // Socket.IO 서버 URL로 변경

      // 필터링할 recipientUid 설정 (예: 사용자의 UID)
      const userRecipientUid = 'e472dc47-764e-492b-8b1f-73287360ac39'

      // 서버에서 읽지 않은 알림을 가져와 화면에 표시하는 함수
      async function loadUnreadNotifications() {
        try {
          const response = await fetch('http://localhost:3000/api/notifications', {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
          })
          const unreadNotifications = await response.json()
          unreadNotifications.forEach((notification) => {
            displayNotification(notification)
          })
        } catch (error) {
          console.error('Error fetching unread notifications:', error)
        }
      }

      // 알림을 화면에 표시하는 함수
      function displayNotification(notification) {
        const notificationList = document.getElementById('notifications')
        const newNotification = document.createElement('li')
        newNotification.textContent = `알림: ${notification.content}`
        notificationList.appendChild(newNotification)
      }

      // 페이지 로드 시 읽지 않은 알림을 가져와 표시
      loadUnreadNotifications()

      // 기존 리스너를 제거하고 새 리스너를 등록
      socket.off('notifications')
      socket.on('notifications', function (notification) {
        // 해당 사용자의 recipientUid와 일치하는 알림만 처리
        if (notification.recipientUid === userRecipientUid) {
          console.log('Notification received from server:', notification.uid)
          const notificationList = document.getElementById('notifications')
          const newNotification = document.createElement('li')
          newNotification.textContent = `알림: ${notification.content}`
          notificationList.appendChild(newNotification)
        }
      })

      socket.on('connect', () => {
        console.log('Connected to server with ID:', socket.id)
      })

      socket.on('disconnect', () => {
        console.log('Disconnected from server')
      })
    </script>
  </body>
</html>
