<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification Test</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
      }

      #notificationContainer {
        max-width: 400px;
        margin: 50px auto;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        padding: 20px;
      }

      #notificationHeader {
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
      }

      #notifications {
        list-style-type: none;
        padding: 0;
        margin: 0;
      }

      #notifications li {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #notifications li:last-child {
        border-bottom: none;
      }

      .notification-content {
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        white-space: normal;
        width: 80%;
      }

      .notification-status {
        font-size: 12px;
        color: #fff;
        background-color: #6c757d;
        padding: 2px 8px;
        border-radius: 4px;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div id="notificationContainer">
      <div id="notificationHeader">내 알림</div>
      <ul id="notifications"></ul>
    </div>

    <script>
      const token =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1aWQiOiJkOTBmYTA3Yi03ZTNmLTQwYmYtOWQ5Yi1lMDllOTM1N2RlZTciLCJlbWFpbCI6ImtpbWNoaUBnbWFpbC5jb20iLCJ0eXBlIjoiY3AiLCJpYXQiOjE3MjM3MzExNjMsImV4cCI6MTcyMzczODM2M30.TFEOzKSXPf1atTsvqig3AbYV5CuKqhTv_X9o9pFLSNc'
      const decodedToken = jwt_decode(token)
      const userRecipientUid = decodedToken.uid

      const socket = io('ws://localhost:3000/notification', {
        query: { token },
      })

      socket.on('connect', () => {
        console.log('WebSocket connection opened')
        loadUnreadNotifications()
      })

      socket.on('disconnect', (event) => {
        console.log('WebSocket connection closed', event)
      })

      socket.on('notifications', (notification) => {
        console.log('Notification received from server:', notification.uid)
        displayNotification(notification)
      })

      async function loadUnreadNotifications() {
        try {
          const response = await fetch('http://localhost:3000/api/notifications', {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
          })
          const unreadNotifications = await response.json()
          console.log('Unread notifications:', unreadNotifications)

          // 서버에서 받은 알림을 화면에 표시
          unreadNotifications.reverse().forEach(displayNotification)
        } catch (error) {
          console.error('Error fetching unread notifications:', error)
        }
      }

      function displayNotification(notification) {
        console.log('Displaying notification:', notification)
        if (notification.recipientUid === userRecipientUid) {
          const notificationList = document.getElementById('notifications')
          if (notificationList) {
            const newNotification = document.createElement('li')

            const contentSpan = document.createElement('span')
            contentSpan.className = 'notification-content'
            contentSpan.textContent = notification.content

            const statusSpan = document.createElement('span')
            statusSpan.className = 'notification-status'
            if (notification.isRead === false) {
              statusSpan.textContent = '안읽음'
            }

            newNotification.appendChild(contentSpan)
            newNotification.appendChild(statusSpan)

            // 문제를 해결하기 위해 잠재적 충돌을 방지하며 DOM 업데이트
            notificationList.insertBefore(newNotification, notificationList.firstChild)

            console.log('Notification added to DOM:', newNotification)
          } else {
            console.error('Notification list element not found')
          }
        }
      }
    </script>
  </body>
</html>
